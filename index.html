<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clash Royale Legacy - Complete</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: system-ui, sans-serif; }
        body { background: #090d16; color: white; text-align: center; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        #top-bar {
            height: 6vh; background: #1e293b; display: flex; justify-content: space-around; align-items: center;
            border-bottom: 2px solid #334155; font-weight: bold; font-size: 13px;
        }

        #game-container { width: 100vw; height: 60vh; position: relative; }

        #bottom-nav {
            height: 7vh; background: #0f172a; display: flex; justify-content: space-around; align-items: center;
            border-top: 2px solid #334155;
        }
        .nav-btn {
            flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 11px; color: #94a3b8; cursor: pointer;
        }
        .nav-btn.active { color: #facc15; background: #1e293b; }

        #battle-ui { 
            height: 27vh; background: #0f172a; padding: 5px; 
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .elixir-container { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #facc15; }
        #elixir-bar { width: 60%; height: 12px; background: #1e293b; border-radius: 6px; overflow: hidden; border: 1.5px solid #facc15; }
        #elixir-fill { width: 50%; height: 100%; background: linear-gradient(90deg, #d97706, #facc15); }
        
        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 2px; }
        .card { 
            height: 65px; background: linear-gradient(145deg, #1e293b, #0f172a); 
            border: 2px solid #38bdf8; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; font-size: 10px;
        }

        .tab-view { display: none; height: 87vh; padding: 15px; overflow-y: auto; background: #0f172a; }
        .shop-item, .chest-item {
            background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155;
        }
        .btn { background: #22c55e; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="top-bar">
    <div>🏆 <span id="trophy-val">450</span></div>
    <div>🪙 <span id="gold-val">1200</span></div>
    <div>💎 <span id="gem-val">80</span></div>
</div>

<div id="game-container"></div>

<div id="shop-view" class="tab-view">
    <h3 style="color: #facc15; margin-bottom: 10px;">🛒 فروشگاه کارت‌ها</h3>
    <div class="shop-item">
        <div><b>🐉 بیبی دراگون</b><br><small>نیروی هوایی</small></div>
        <button class="btn" onclick="buyCard('dragon', 400)">400 🪙</button>
    </div>
    <div class="shop-item">
        <div><b>⚡ اسپل زپ</b><br><small>آسیب منطقه‌ای</small></div>
        <button class="btn" onclick="buyCard('zap', 150)">150 🪙</button>
    </div>
</div>

<div id="chests-view" class="tab-view">
    <h3 style="color: #facc15; margin-bottom: 10px;">🧰 صندوق‌ها</h3>
    <div class="chest-item">
        <div><b>📦 صندوق رایگان</b><br><small>آماده دریافت</small></div>
        <button class="btn" onclick="openChest('free')">باز کردن</button>
    </div>
    <div class="chest-item">
        <div><b>🥇 صندوق طلایی</b><br><small>۴۰۰ سکه</small></div>
        <button class="btn" onclick="openChest('gold')">50 💎</button>
    </div>
</div>

<div id="battle-ui">
    <div class="elixir-container">
        <span>🧪 اکسیر: <b id="elixir-num">5</b>/10</span>
        <div id="elixir-bar"><div id="elixir-fill"></div></div>
    </div>
    <div class="cards">
        <div class="card" onclick="spawnUnit('knight', 'player')"><span>⚔️</span><b>شوالیه (3)</b></div>
        <div class="card" onclick="spawnUnit('archer', 'player')"><span>🏹</span><b>کماندار (2)</b></div>
        <div class="card" onclick="spawnUnit('valkyrie', 'player')"><span>🪓</span><b>والکری (4)</b></div>
        <div class="card" onclick="spawnUnit('giant', 'player')"><span>🛡️</span><b>غول (5)</b></div>
        <div class="card" onclick="spawnUnit('dragon', 'player')"><span>🐉</span><b>دراگون (4)</b></div>
        <div class="card" onclick="spawnUnit('skeletons', 'player')"><span>💀</span><b>اسکلت (1)</b></div>
        <div class="card" onclick="spawnUnit('wallbreaker', 'player')"><span>💣</span><b>بمب‌افکن (2)</b></div>
        <div class="card" onclick="spawnUnit('zap', 'player')"><span>⚡</span><b>زپ (2)</b></div>
    </div>
</div>

<div id="bottom-nav">
    <div class="nav-btn" onclick="openTab('shop')">🛒<br>فروشگاه</div>
    <div class="nav-btn active" onclick="openTab('battle')">⚔️<br>نبرد</div>
    <div class="nav-btn" onclick="openTab('chests')">🧰<br>صندوق‌ها</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // سیستم ذخیره‌سازی
    let gold = parseInt(localStorage.getItem('gold')) || 1200;
    let gems = parseInt(localStorage.getItem('gems')) || 80;
    let trophies = parseInt(localStorage.getItem('trophies')) || 450;
    let elixir = 5;
    let enemyElixir = 5;
    const maxElixir = 10;
    let phaserScene = null;

    function saveState() {
        localStorage.setItem('gold', gold);
        localStorage.setItem('gems', gems);
        localStorage.setItem('trophies', trophies);
        document.getElementById('gold-val').innerText = gold;
        document.getElementById('gem-val').innerText = gems;
        document.getElementById('trophy-val').innerText = trophies;
    }
    saveState();

    // موتور صوتی وب
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function openTab(tab) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-view').forEach(v => v.style.display = 'none');

        if (tab === 'battle') {
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('battle-ui').style.display = 'flex';
        } else {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('battle-ui').style.display = 'none';
            document.getElementById(tab + '-view').style.display = 'block';
        }
    }

    function buyCard(card, cost) {
        if (gold >= cost) {
            gold -= cost;
            saveState();
            tg.showAlert("کارت با موفقیت خریداری شد!");
        } else {
            tg.showAlert("سکه کافی نداری!");
        }
    }

    function openChest(type) {
        if (type === 'free') {
            gold += 100;
            gems += 5;
            tg.showAlert("شما ۱۰۰ سکه و ۵ جم دریافت کردید!");
        } else if (type === 'gold' && gems >= 50) {
            gems -= 50;
            gold += 400;
            tg.showAlert("شما ۴۰۰ سکه دریافت کردید!");
        }
        saveState();
    }

    // مدیریت اکسیر بازیکن و دشمن
    setInterval(() => {
        if (elixir < maxElixir) {
            elixir = Math.min(maxElixir, elixir + 0.5);
            document.getElementById('elixir-num').innerText = Math.floor(elixir);
            document.getElementById('elixir-fill').style.width = (elixir / maxElixir * 100) + '%';
        }
        if (enemyElixir < maxElixir) {
            enemyElixir = Math.min(maxElixir, enemyElixir + 0.5);
        }
        
        // هوش مصنوعی ربات دشمن
        if (enemyElixir >= 4) {
            const botCards = ['knight', 'archer', 'valkyrie', 'giant'];
            const randomCard = botCards[Math.floor(Math.random() * botCards.length)];
            spawnUnit(randomCard, 'enemy');
            enemyElixir -= 3;
        }
    }, 1000);

    const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: window.innerWidth,
        height: window.innerHeight * 0.60,
        physics: { default: 'arcade', arcade: { debug: false } },
        scene: { create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let units = [];
    let towers = [];

    function create() {
        phaserScene = this;
        const w = this.cameras.main.width;
        const h = this.cameras.main.height;

        this.add.rectangle(w/2, h/2, w, h, 0x2e7d32);
        this.add.rectangle(w/2, h*0.5, w, h*0.06, 0x0284c7);
        this.add.rectangle(w*0.22, h*0.5, 45, h*0.1, 0xb45309);
        this.add.rectangle(w*0.78, h*0.5, 45, h*0.1, 0xb45309);

        towers.push(createTower(this, w*0.22, h*0.12, 'enemy', 600, '🏰'));
        towers.push(createTower(this, w*0.78, h*0.12, 'enemy', 600, '🏰'));
        towers.push(createTower(this, w*0.5, h*0.06, 'enemy', 1000, '👑'));

        towers.push(createTower(this, w*0.22, h*0.88, 'player', 600, '🏰'));
        towers.push(createTower(this, w*0.78, h*0.88, 'player', 600, '🏰'));
        towers.push(createTower(this, w*0.5, h*0.94, 'player', 1000, '👑'));
    }

    function createTower(scene, x, y, team, hp, icon) {
        const color = team === 'enemy' ? 0xef4444 : 0x3b82f6;
        const container = scene.add.container(x, y);
        const base = scene.add.rectangle(0, 0, 44, 44, color);
        const text = scene.add.text(0, 0, icon, { fontSize: '20px' }).setOrigin(0.5);
        container.add([base, text]);
        scene.physics.world.enable(container);
        return { container, team, hp, maxHp: hp, x, y };
    }

    function spawnUnit(type, team) {
        if (!phaserScene) return;
        const costs = { knight: 3, archer: 2, valkyrie: 4, giant: 5, dragon: 4, skeletons: 1, wallbreaker: 2, zap: 2 };
        const cost = costs[type];

        if (team === 'player') {
            if (elixir < cost) {
                tg.showAlert("اکسیر کافی نداری!");
                return;
            }
            elixir -= cost;
        }

        playSound(440, 0.15); // صدای پیاده‌سازی نیرو

        const w = phaserScene.cameras.main.width;
        const h = phaserScene.cameras.main.height;

        const icons = { knight: '⚔️', archer: '🏹', valkyrie: '🪓', giant: '🛡️', dragon: '🐉', skeletons: '💀', wallbreaker: '💣', zap: '⚡' };
        const startY = team === 'player' ? h * 0.75 : h * 0.25;

        const text = phaserScene.add.text(w/2 + (Math.random()*60 - 30), startY, icons[type], { fontSize: '22px' }).setOrigin(0.5);
        phaserScene.physics.world.enable(text);

        units.push({ obj: text, type: type, team: team, hp: 180, speed: team === 'player' ? 55 : -55, damage: 20 });
    }

    function update(time, delta) {
        units.forEach(u => {
            if (u.hp <= 0) return;
            let target = towers.find(t => t.team !== u.team && t.hp > 0);
            if (target) {
                const dist = Phaser.Math.Distance.Between(u.obj.x, u.obj.y, target.x, target.y);
                if (dist > 30) {
                    phaserScene.physics.moveTo(u.obj, target.x, target.y, Math.abs(u.speed));
                } else {
                    u.obj.body.setVelocity(0, 0);
                    target.hp -= u.damage * (delta / 1000);
                    if (target.hp <= 0) target.container.setAlpha(0.3);
                }
            }
        });
    }
</script>
</body>
</html>
